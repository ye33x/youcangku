server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: youguocang-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/youguocang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 业务自定义配置
youguocang:
  jwt:
    # 生产环境请通过环境变量 YOUGUOCANG_JWT_SECRET 覆盖
    secret: ${YOUGUOCANG_JWT_SECRET:youguocang-demo-secret-key-please-change-in-production-32bytes}
    # token 有效期（小时）
    expire-hours: 24
  recommend:
    # 推荐条数
    top-n: 8
    # 行为总数低于该值视为半冷启动，走混合策略
    cold-start-threshold: 3
    # 候选商品池大小
    candidate-limit: 200

logging:
  level:
    com.youguocang: debug
